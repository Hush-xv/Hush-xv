name: Latest blog posts

on:
  schedule:
    - cron: "0 1 * * *" # 每天 UTC 1 点（北京时间 9 点）同步
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Pull latest posts from blog RSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://hush-xv.github.io/rss.xml"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
