name: Render stat cards

on:
  schedule:
    - cron: "0 3 * * *" # 每天 UTC 3 点刷新卡片
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-cards.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch streak & quote from public services
        run: |
          mkdir -p assets
          fetch() {
            curl -fsSL --retry 3 --retry-delay 5 -o "assets/$2.tmp" "$1" \
              && mv "assets/$2.tmp" "assets/$2" \
              || { echo "::warning::fetch failed: $2"; rm -f "assets/$2.tmp"; }
          }
          fetch "https://streak-stats.demolab.com?user=Hush-xv&hide_border=true&background=0D1117&ring=0891B2&currStreakLabel=67E8F9&sideLabels=A5F3FC&dates=C9D1D9&currStreakNum=C9D1D9&sideNums=C9D1D9" streak.svg
          fetch "https://quotes-github-readme.vercel.app/api?type=horizontal&theme=dark" quote.png

      - name: Render metrics card (self-hosted, no third-party limit)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Hush-xv
          filename: assets/metrics.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          config_timezone: Asia/Shanghai
          base: header, activity, community, repositories, metadata
          config_display: large

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh stat cards"
