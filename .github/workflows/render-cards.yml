name: Render stat cards

on:
  schedule:
    - cron: "0 3 * * *" # 每天 UTC 3 点刷新卡片
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-cards.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render metrics card (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Hush-xv
          filename: assets/metrics.svg
          config_timezone: Asia/Shanghai
          base: header, activity, community, repositories, metadata
          config_display: large
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Render metrics card (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Hush-xv
          filename: assets/metrics-light.svg
          config_timezone: Asia/Shanghai
          base: header, activity, community, repositories, metadata
          config_display: large
          config_theme: light
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Fetch streak cards (dark + light)
        run: |
          mkdir -p assets
          fetch() {
            curl -fsSL --retry 3 --retry-delay 5 -o "assets/$2.tmp" "$1" \
              && mv "assets/$2.tmp" "assets/$2" \
              || { echo "::warning::fetch failed: $2"; rm -f "assets/$2.tmp"; }
          }
          fetch "https://streak-stats.demolab.com?user=Hush-xv&hide_border=true&background=0D1117&ring=0891B2&currStreakLabel=67E8F9&sideLabels=A5F3FC&dates=C9D1D9&currStreakNum=C9D1D9&sideNums=C9D1D9" streak.svg
          fetch "https://streak-stats.demolab.com?user=Hush-xv&hide_border=true&background=FFFFFF&ring=0891B2&currStreakLabel=0891B2&sideLabels=57606A&dates=57606A&currStreakNum=24292F&sideNums=24292F" streak-light.svg

      - name: Rebase over remote updates
        run: |
          git checkout -- . || true
          git pull --rebase origin main

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh stat cards"
