name: Generate contribution snake

on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 2 点自动生成
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Hush-xv
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23F0ABFC&color_dots=%23E4EDEF,%239BE9A8,%2340C463,%2330A14E,%23216E39
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F0ABFC&color_dots=%2316324F,%231D4ED8,%230891B2,%2322D3EE,%2367E8F9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
