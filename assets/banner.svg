<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="夜空动画横幅">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0ABFC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EFF6FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#EFF6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <circle cx="950" cy="120" r="240" fill="url(#glowA)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 34,-16; 0,0" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="220" r="260" fill="url(#glowB)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -28,14; 0,0" dur="19s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="90" r="150" fill="url(#glowC)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 20,18; 0,0" dur="13s" repeatCount="indefinite"/>
  </circle>

  <g fill="#FFFFFF">
    <circle cx="80" cy="50" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="110" r="1.1"><animate attributeName="opacity" values="1;0.15;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="130" r="1.8"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="150" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="45" r="1.1"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="90" r="1.7"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="120" r="1.6"><animate attributeName="opacity" values="1;0.15;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="220" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="190" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="180" r="1.0"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="200" r="1.2"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="180" r="1.0"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="1000" cy="70" r="70" fill="url(#moonHalo)"/>
  <circle cx="1000" cy="70" r="22" fill="#EFF6FF" opacity="0.95"/>

  <polygon points="0,300 0,240 140,195 300,235 470,180 640,240 830,185 1000,240 1200,195 1200,300" fill="#16324F" opacity="0.92"/>
  <polygon points="0,300 0,265 180,230 380,265 580,225 800,270 1000,230 1200,265 1200,300" fill="#0C1B33" opacity="0.97"/>

  <g font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="62" font-weight="bold" text-anchor="middle">
    <text x="600" y="140" fill="#F472B6" opacity="0.55">Hush-xv
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; -4,2; 0,0; 3,-2; 0,0; 0,0; 0,0" keyTimes="0;0.5;0.56;0.62;0.68;0.74;0.8;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="140" fill="#22D3EE" opacity="0.55">Hush-xv
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 4,-2; 0,0; -3,2; 0,0; 0,0; 0,0" keyTimes="0;0.5;0.56;0.62;0.68;0.74;0.8;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="140" fill="#EFF6FF">Hush-xv</text>
  </g>
  <text x="600" y="192" text-anchor="middle" font-family="Georgia, 'Songti SC', serif" font-size="26" fill="#A5F3FC" opacity="0.92">✦ 记录技术与生活 ✦</text>

  <rect x="0" y="-4" width="1200" height="3" fill="#FFFFFF" opacity="0.07">
    <animate attributeName="y" values="-4;304" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
