<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="波浪页脚">
  <defs>
    <linearGradient id="fsea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="0.5" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="140" fill="#020617"/>
  <circle cx="600" cy="70" r="220" fill="url(#fglow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 26,10; 0,0" dur="15s" repeatCount="indefinite"/>
  </circle>

  <g fill="#FFFFFF">
    <circle cx="150" cy="40" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="25" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="45" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="30" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="50" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <path d="M0,70 C200,30 400,110 600,70 C800,30 1000,110 1200,70 L1200,140 L0,140 Z" fill="url(#fsea)" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" values="-60,0; 60,0; -60,0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0,90 C250,50 450,120 600,90 C800,55 1000,125 1200,90 L1200,140 L0,140 Z" fill="url(#fsea)" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="40,0; -40,0; 40,0" dur="11s" repeatCount="indefinite"/>
  </path>
  <path d="M0,110 C200,80 500,140 700,105 C900,75 1050,135 1200,105 L1200,140 L0,140 Z" fill="#0891B2" opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="-30,0; 30,0; -30,0" dur="7s" repeatCount="indefinite"/>
  </path>
</svg>
